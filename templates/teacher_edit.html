{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">

    <div class="d-flex align-items-center mb-4">
      <a href="/teachers" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left"></i> Назад
      </a>
      <h5 class="fw-bold mb-0">Редактировать учителя</h5>
    </div>

    {% if error %}
    <div class="alert alert-danger">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
    </div>
    {% endif %}

    <div class="card info-card">
      <div class="card-body">
        <form method="post" action="/teachers/{{ teacher.id }}/edit">
          <div class="mb-3">
            <label class="form-label fw-semibold">ФИО</label>
            <input name="name" class="form-control" value="{{ teacher.name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Предметы (через запятую)</label>
            <input name="specialization" class="form-control"
                   value="{{ teacher.specialization | join(', ') }}"
                   placeholder="Математика, Физика">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Ставка (часов в месяц)</label>
            <input name="rate" type="number" class="form-control"
                   value="{{ teacher.rate }}" min="0" max="200">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-floppy me-1"></i>Сохранить
            </button>
            <a href="/teachers" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
